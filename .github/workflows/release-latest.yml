name: Release Latest

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: release-latest
  cancel-in-progress: true

permissions:
  actions: read
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    # Same distribution (and Qt) the .deb is built for.
    container: ubuntu:26.04
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            build-essential \
            pkg-config \
            libudev-dev \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-declarative-dev \
            qt6-declarative-dev-tools

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check
        run: cargo check --locked --workspace

      - name: Test
        run: cargo test --locked --workspace

  build-linux:
    needs: validate
    uses: ./.github/workflows/release-linux-deb.yml
    permissions:
      contents: write

  publish:
    needs:
      - validate
      - build-linux
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create or overwrite latest release
        run: |
          commit_sha=$(git rev-parse HEAD)
          commit_short=$(git rev-parse --short HEAD)
          timestamp=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          if gh release view latest >/dev/null 2>&1; then
            gh release delete latest --yes --cleanup-tag
          fi

          mapfile -d '' release_files < <(find release-artifacts -type f -print0)

          gh release create latest "${release_files[@]}" \
            --target "$commit_sha" \
            --latest \
            --title "Basalt Latest Build ($commit_short)" \
            --notes "Automated Basalt build. Commit: $commit_sha. Built: $timestamp"

          gh release edit latest --draft=false --latest --target "$commit_sha"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
