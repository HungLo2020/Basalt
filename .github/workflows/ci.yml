name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    # Same distribution (and Qt) the .deb is built for.
    container: ubuntu:26.04
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            build-essential \
            pkg-config \
            libudev-dev \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-declarative-dev \
            qt6-declarative-dev-tools \
            qml6-module-org-kde-kirigami \
            qml6-module-org-kde-desktop \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qt6-svg-plugins \
            fonts-dejavu-core \
            python3

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check
        run: cargo check --locked --workspace

      - name: Test
        run: cargo test --locked --workspace

      - name: Lint QML
        run: bash DevUtils/LintQml.sh

      - name: Smoke test the GUI
        run: bash DevUtils/SmokeTestGui.sh "$GITHUB_WORKSPACE/gui-smoke"

      - name: Upload GUI smoke-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-smoke-screenshots
          path: gui-smoke
          if-no-files-found: ignore

      - name: Test publish script
        run: python3 -m unittest discover -s tests
