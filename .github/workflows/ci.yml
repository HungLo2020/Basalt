name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    # Same distribution (and Qt) the .deb is built for.
    container: ubuntu:26.04
    steps:
      # git first, so checkout makes a real clone; the rest comes from the shared package list.
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: bash DevUtils/InstallDependencies.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check
        run: cargo check --locked --workspace

      - name: Test
        run: cargo test --locked --workspace

      - name: Lint QML
        run: bash DevUtils/LintQml.sh

      - name: Smoke test the GUI
        run: bash DevUtils/SmokeTestGui.sh "$GITHUB_WORKSPACE/gui-smoke"

      - name: Upload GUI smoke-test screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gui-smoke-screenshots
          path: gui-smoke
          if-no-files-found: ignore

      - name: Test publish script
        run: python3 -m unittest discover -s tests
