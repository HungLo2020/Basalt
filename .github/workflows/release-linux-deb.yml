name: Build Linux amd64 DEB

# Manual only: apt users get releases from PublishMattOSPackage.py. This builds the .deb in a clean
# container and keeps it as a workflow artifact (and, given a tag, uploads it to that release).
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to upload the built DEB to (optional)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build-linux-amd64-deb:
    runs-on: ubuntu-24.04
    # Build inside the distribution the package targets: basalt-gui links that release's Qt 6
    # (Kirigami needs Qt 6.5+), and dpkg-shlibdeps derives the package's Depends from it.
    container: ubuntu:26.04
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      # git first, so checkout makes a real clone; the rest comes from the shared package list.
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git

      - name: Checkout release tag
        if: env.RELEASE_TAG != ''
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Checkout current ref
        if: env.RELEASE_TAG == ''
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: bash DevUtils/InstallDependencies.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Linux amd64 DEB
        run: bash DevUtils/BuildScripts/build-linux-amd64.sh

      - name: Read build metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          source builds/latest-build.env
          echo "artifact_path=$BUILD_ARTIFACT_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload Linux DEB to GitHub release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ steps.metadata.outputs.artifact_path }}
          overwrite_files: true
          fail_on_unmatched_files: true

      - name: Upload Linux DEB workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: basalt-linux-amd64-deb
          path: ${{ steps.metadata.outputs.artifact_path }}
          if-no-files-found: error
