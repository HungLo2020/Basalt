[package]
name = "basalt-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Basalt launcher command-line interface"

[[bin]]
name = "basalt"
path = "src/main.rs"

[dependencies]
basalt-core.workspace = true
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
