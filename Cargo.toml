[workspace]
resolver = "2"
members = [
    "crates/basalt-core",
    "crates/basalt-cli",
    "crates/basalt-gui-kirigami",
]
# Plain `cargo run` starts the GUI, and `cargo build/test` cover it plus the core.
# The CLI needs `-p basalt-cli` (or `--workspace`).
default-members = ["crates/basalt-core", "crates/basalt-gui-kirigami"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.89"

[workspace.dependencies]
basalt-core = { path = "crates/basalt-core" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
