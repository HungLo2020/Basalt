[workspace]
resolver = "2"
members = ["crates/basalt-core", "crates/basalt-cli", "crates/basalt-gui"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.89"

[workspace.dependencies]
basalt-core = { path = "crates/basalt-core" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
resvg = "0.45"
